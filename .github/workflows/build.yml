name: Build Khushi

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

jobs:
  # ============================================================
  # LINUX
  # ============================================================
  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check tools
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux
        run: |
          pnpm tauri build \
            --bundles deb,rpm,appimage

        # -------------------------
        # ZIP Linux packages
        # -------------------------

      - name: Zip Linux DEB
        working-directory: src-tauri/target/release/bundle/deb
        run: |
          zip -r "$GITHUB_WORKSPACE/khushi-linux-deb-0.1.2.zip" .

      - name: Zip Linux RPM
        working-directory: src-tauri/target/release/bundle/rpm
        run: |
          zip -r "$GITHUB_WORKSPACE/khushi-linux-rpm-0.1.2.zip" .

      - name: Zip Linux AppImage
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          zip -r "$GITHUB_WORKSPACE/khushi-linux-appimage-0.1.2.zip" .

      # -------------------------
      # Upload artifacts
      # -------------------------

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: khushi-linux-deb
          if-no-files-found: error
          path: khushi-linux-deb-0.1.2.zip

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: khushi-linux-rpm
          if-no-files-found: error
          path: khushi-linux-rpm-0.1.2.zip

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: khushi-linux-appimage
          if-no-files-found: error
          path: khushi-linux-appimage-0.1.2.zip
  # ============================================================
  # WINDOWS
  # ============================================================
  windows:
    name: Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tools
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        run: pnpm tauri build --bundles nsis,msi

      - name: Zip Windows NSIS
        working-directory: src-tauri/target/release/bundle/nsis
        run: |
          7z a "$GITHUB_WORKSPACE/khushi-windows-nsis-0.1.2.zip" .

      - name: Zip Windows MSI
        working-directory: src-tauri/target/release/bundle/msi
        run: |
          7z a "$GITHUB_WORKSPACE/khushi-windows-msi-0.1.2.zip" .

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: khushi-windows-nsis
          if-no-files-found: error
          path: khushi-windows-nsis-0.1.2.zip

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: khushi-windows-msi
          if-no-files-found: error
          path: khushi-windows-msi-0.1.2.zip

  # ============================================================
  # MACOS
  # ============================================================
  macos:
    name: macOS ARM64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Check CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Check tools
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS
        run: |
          pnpm tauri build \
            --target aarch64-apple-darwin \
            --bundles app,dmg

      - name: Zip macOS ARM64 APP
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/app
        run: |
          zip -r "$GITHUB_WORKSPACE/khushi-macos-arm64-app-0.1.2.zip" .

      - name: Zip macOS ARM64 DMG
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: |
          zip -r "$GITHUB_WORKSPACE/khushi-macos-arm64-dmg-0.1.2.zip" .

      - name: Upload macOS ARM64 APP
        uses: actions/upload-artifact@v4
        with:
          name: khushi-macos-arm64-app
          if-no-files-found: error
          path: khushi-macos-arm64-app-0.1.2.zip

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: khushi-macos-arm64-dmg
          if-no-files-found: error
          path: khushi-macos-arm64-dmg-0.1.2.zip
